[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_BASE_URL = "https://your-backend-url.railway.app/api/v1"
  VITE_APP_NAME = "Movie & TV Show Manager"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
